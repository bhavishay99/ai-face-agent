<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Agent - Ultimate Biometric Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .webcam-box {
            width: 100%;
            max-width: 420px;
            height: 260px;
            background: #000;
            border-radius: 16px;
            margin: 15px auto;
            overflow: hidden;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .webcam-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Scanning Laser Line Animation */
        .laser-scan {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #38bdf8;
            box-shadow: 0 0 15px #38bdf8, 0 0 30px #38bdf8;
            animation: scanMove 2s infinite ease-in-out;
        }
        @keyframes scanMove {
            0% { top: 0%; }
            50% { top: 95%; }
            100% { top: 0%; }
        }
        .scan-steps {
            text-align: left;
            font-family: monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            background: rgba(2, 6, 23, 0.8);
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
            max-height: 110px;
            overflow-y: auto;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body>

    <!-- Accessibility Bar -->
    <div class="accessibility-bar">
        <button id="btnNormal" class="access-btn active" onclick="setVisionMode('normal')">👁️ Normal View</button>
        <button id="btnProblem" class="access-btn" onclick="setVisionMode('problem')">👓 High Vision</button>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <h1>AI Face Agent</h1>
        <p class="subtitle">Next-Gen Biometric Face Authentication & Neural Portal</p>

        <div class="face-preview-box">
            <svg viewBox="0 0 24 24" width="70" height="70" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M12 5l7 7-7 7"/>
                <circle cx="12" cy="12" r="10" stroke="#60a5fa"/>
                <path d="M12 8v4l3 3" />
            </svg>
        </div>

        <div class="btn-group">
            <button class="action-btn btn-register" onclick="startAutoBiometricScan('register')">
                📷 Register with Face (ऑटो फेस रजिस्टर)
            </button>
            <button class="action-btn btn-guest" onclick="startAutoBiometricScan('guest')">
                👤 Login as Guest (ऑटो गेस्ट लॉगिन)
            </button>
        </div>
    </div>

    <!-- Live Automated Biometric Modal -->
    <div id="customModal" class="modal-overlay">
        <div class="breathing-modal" style="max-width: 480px; text-align: center;">
            <h3 id="modalTitle" style="color: #38bdf8; margin-bottom: 5px;">AI Biometric Scanner</h3>
            <p id="modalDesc" style="font-size: 0.9rem; color: #94a3b8;">कृपया कैमरे के सामने स्थिर बैठें...</p>
            
            <!-- Real Webcam with Laser Scan Effect -->
            <div class="webcam-box" id="camContainer" style="display:none;">
                <div class="laser-scan"></div>
                <video id="webcamFeed" autoplay playsinline muted></video>
            </div>

            <!-- Real-time Multi-Step Detection Terminal Box -->
            <div id="scanStepsBox" class="scan-steps" style="display:none;">
                [00.0s] Initializing optical sensor...<br>
            </div>

            <div id="timerCountdown" style="font-size: 1.2rem; font-weight: bold; color: #f59e0b; margin-top: 10px;"></div>
        </div>
    </div>

    <script>
        let videoStream = null;

        function setVisionMode(mode) {
            const body = document.body;
            if (mode === 'problem') {
                body.classList.add('vision-assist-active');
                localStorage.setItem('visionMode', 'problem');
            } else {
                body.classList.remove('vision-assist-active');
                localStorage.setItem('visionMode', 'normal');
            }
        }

        window.onload = function() {
            if (localStorage.getItem('visionMode') === 'problem') {
                setVisionMode('problem');
            }
        };

        async function startAutoBiometricScan(type) {
            const modal = document.getElementById('customModal');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDesc');
            const video = document.getElementById('webcamFeed');
            const camContainer = document.getElementById('camContainer');
            const stepsBox = document.getElementById('scanStepsBox');
            const timerBox = document.getElementById('timerCountdown');

            modal.classList.add('show');
            camContainer.style.display = 'flex';
            stepsBox.style.display = 'block';

            if (type === 'register') {
                title.innerText = "📷 Face Biometric Registration";
            } else {
                title.innerText = "👤 Guest Face Authentication";
            }

            try {
                // Turn on actual webcam
                videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = videoStream;
            } catch (err) {
                desc.innerText = "⚠️ कैमरा एक्सेस नहीं मिला (सिमुलेशन मोड चालू है)";
            }

            // Sequential 5-Second Automated Multi-Step Detection
            stepsBox.innerHTML = "[0.5s] Camera stream connected.<br>";
            timerBox.innerText = "⏳ ऑटो-लॉगिन में 5 सेकंड बाकी...";

            setTimeout(() => {
                stepsBox.innerHTML += "[1.5s] 👤 Face contour detected successfully.<br>";
                timerBox.innerText = "⏳ ऑटो-लॉगिन में 4 सेकंड बाकी...";
            }, 1200);

            setTimeout(() => {
                stepsBox.innerHTML += "[2.5s] 👁️ Eye metrics & iris mapping verified.<br>";
                timerBox.innerText = "⏳ ऑटो-लॉगिन में 3 सेकंड बाकी...";
            }, 2400);

            setTimeout(() => {
                stepsBox.innerHTML += "[3.5s] 👃 Nose & facial geometry matched (99.8%).<br>";
                timerBox.innerText = "⏳ ऑटो-लॉगिन में 2 सेकंड बाकी...";
            }, 3600);

            setTimeout(() => {
                stepsBox.innerHTML += "[4.5s] ✅ Biometric signature encrypted & authorized!<br>";
                timerBox.innerText = "🚀 रीडायरेक्ट किया जा रहा है...";
            }, 4600);

            // Exactly at 5.2 seconds, automatically redirect to dashboard.html without clicking anything!
            setTimeout(() => {
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                }
                window.location.href = "dashboard.html";
            }, 5200);
        }
    </script>
</body>
</html>
